    <style>.discovery-trigger{min-width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(23,61,49,.14);border-radius:13px;background:rgba(255,255,255,.5);color:#173d31;transition:transform 220ms var(--ease),background 180ms,border-color 180ms,box-shadow 180ms,opacity 180ms;touch-action:manipulation}.discovery-trigger svg{width:18px;height:18px;transition:transform 240ms var(--ease)}.discovery-trigger span{font-size:10px;font-weight:800}.discovery-trigger kbd{margin-left:2px;font-size:8px}.discovery-trigger.is-loading{cursor:progress;opacity:.78}.discovery-trigger.is-loading svg{animation:discovery-trigger-loading 760ms linear infinite}.discovery-boot>div{flex:1}.discovery-boot.is-online>.discovery-boot__signal{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#efc979;background:transparent;box-shadow:none;animation:discovery-trigger-loading 760ms linear infinite}.discovery-boot.is-error{pointer-events:auto}.discovery-boot>button{min-height:40px;padding-inline:12px;border:1px solid rgba(255,255,255,.26);border-radius:9px;background:rgba(255,255,255,.1);color:inherit;font-size:9px;font-weight:800}@media(hover:hover){.discovery-trigger:hover,.discovery-trigger:focus-visible{border-color:rgba(198,139,44,.5);background:#fff;box-shadow:0 10px 25px rgba(23,61,49,.11);transform:translateY(-2px)}.discovery-trigger:hover svg,.discovery-trigger:focus-visible svg{transform:rotate(-10deg) scale(1.08)}}@media(pointer:coarse){.discovery-trigger:active{transform:scale(.975)}}@media(max-width:1100px){.discovery-trigger span,.discovery-trigger kbd{display:none}}@media(max-width:600px){.discovery-boot small{display:none}}@keyframes discovery-trigger-loading{to{transform:rotate(360deg)}}</style>
